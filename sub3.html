<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>weve adventure - Duo & Trilhos</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a2e; font-family: 'Segoe UI', Tahoma, sans-serif; }
        #game-ui {
            position: absolute; top: 20px; left: 20px; color: white; font-size: 24px; font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8); z-index: 10;
        }
        .ui-box { background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 10px; margin-bottom: 10px; border: 2px solid #555; }
        #moedas-ui { color: #ffd700; }
        #menu {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8);
            display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; z-index: 20;
        }
        #menu h1 { font-size: 48px; margin-bottom: 10px; color: #ffcc00; text-transform: uppercase; }
        #menu p { font-size: 18px; text-align: center; line-height: 1.5; }
        .key { background: #fff; color: #000; padding: 2px 8px; border-radius: 4px; font-weight: bold; }
        button {
            margin-top: 20px; padding: 15px 40px; font-size: 24px; font-weight: bold; cursor: pointer; background-color: #ff5722;
            color: white; border: none; border-radius: 8px; box-shadow: 0 6px 0 #e64a19; transition: all 0.1s;
        }
        button:active { transform: translateY(6px); box-shadow: none; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="game-ui">
        <div class="ui-box">Pontos: <span id="score">0</span></div>
        <div class="ui-box" id="moedas-ui">Moedas: <span id="coins">0</span></div>
    </div>
    
    <div id="menu">
        <h1>Corrida Duo 3D</h1>
        <p>
            <span class="key">←</span> <span class="key">→</span> Mover <br>
            <span class="key">↑</span> Pular (Evite Trens Vermelhos) <br>
            <span class="key">↓</span> Agachar (Passe sob Barreiras Laranjas)
        </p>
        <button id="start-btn">JOGAR</button>
    </div>

    <script>
        // --- 1. CONFIGURAÇÕES DE ÁUDIO ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            
            if (type === 'jump') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(300, now); osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
                gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'crouch') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(150, now + 0.1);
                gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'crash') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(20, now + 0.3);
                gain.gain.setValueAtTime(0.5, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'coin') {
                osc.type = 'square'; osc.frequency.setValueAtTime(900, now); osc.frequency.setValueAtTime(1200, now + 0.05);
                gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            }
        }

        // --- 2. GERADORES DE TEXTURA (Canvas) ---
        function createSignTexture(direction) {
            const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 256; const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffaa00'; ctx.fillRect(0,0,256,256);
            ctx.fillStyle = '#000000'; ctx.font = "bold 180px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText(direction === 'left' ? "←" : "→", 128, 140);
            return new THREE.CanvasTexture(canvas);
        }

        function createTrackTexture() {
            const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 512; const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#2a2a35'; ctx.fillRect(0, 0, 512, 512); // Cascalho base
            
            // Mapeando posições X para as 3 pistas (16 unidades Three.js = 512px Canvas)
            const lanes = [176, 256, 336];
            lanes.forEach(x => {
                ctx.fillStyle = '#4a3018'; // Dormentes (Madeira horizontal)
                for(let y=0; y<512; y+=64) ctx.fillRect(x - 35, y + 16, 70, 24);
                ctx.fillStyle = '#888899'; // Trilhos (Metal vertical)
                ctx.fillRect(x - 20, 0, 6, 512); ctx.fillRect(x + 14, 0, 6, 512);
            });

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(1, 40); // Estica e repete no eixo Z do plano longo
            return tex;
        }

        const texArrowLeft = createSignTexture('left');
        const texArrowRight = createSignTexture('right');
        const trackTexture = createTrackTexture();

        // --- 3. CONFIGURAÇÃO DO THREE.JS ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0x1a1a2e, 10, 60);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 4.5, 8); // Câmera um pouco mais longe para ver o duo

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x1a1a2e);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.5); dirLight.position.set(10, 20, 10); scene.add(dirLight);

        const worldGroup = new THREE.Group();
        scene.add(worldGroup);

        // Chão com Trilhos
        const groundMat = new THREE.MeshLambertMaterial({ map: trackTexture });
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(16, 200), groundMat);
        ground.rotation.x = -Math.PI / 2; ground.position.z = -50;
        worldGroup.add(ground);

        // Paredes
        const wallMat = new THREE.MeshLambertMaterial({ color: 0x333344 });
        const wallGeo = new THREE.BoxGeometry(2, 10, 200);
        const leftWall = new THREE.Mesh(wallGeo, wallMat); leftWall.position.set(-9, 5, -50); worldGroup.add(leftWall);
        const rightWall = new THREE.Mesh(wallGeo, wallMat); rightWall.position.set(9, 5, -50); worldGroup.add(rightWall);

        // Jogador 1 (Principal - Azul Claro)
        const player = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), new THREE.MeshLambertMaterial({ color: 0x00ffcc }));
        scene.add(player);

        // Jogador 2 (Parceiro - Magenta)
        const player2 = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.8, 0.8), new THREE.MeshLambertMaterial({ color: 0xff00ff }));
        scene.add(player2);

        // Variáveis
        const laneWidth = 2.5; let currentLane = 0;
        let isJumping = false; let yVelocity = 0;
        let isCrouching = false; let crouchTimer = 0;
        let entities = []; let gameActive = false; let score = 0; let coinsCollected = 0; let speed = 0.4; let spawnTimer = 0;
        let curveOffset = 0; let curveTime = 0;

        const scoreEl = document.getElementById('score'); const coinsEl = document.getElementById('coins'); const menuEl = document.getElementById('menu');

        // --- 4. OBJETOS ---
        const trainGeo = new THREE.BoxGeometry(2.2, 2.5, 4); const trainMat = new THREE.MeshLambertMaterial({ color: 0xff3333 });
        const barrierGeo = new THREE.BoxGeometry(2.5, 0.5, 1); const barrierMat = new THREE.MeshLambertMaterial({ color: 0xff8800 });
        const coinGeo = new THREE.TorusGeometry(0.4, 0.15, 8, 16); const coinMat = new THREE.MeshLambertMaterial({ color: 0xffd700 });
        const signGeo = new THREE.PlaneGeometry(3, 3);
        const signLeftMat = new THREE.MeshBasicMaterial({ map: texArrowLeft }); const signRightMat = new THREE.MeshBasicMaterial({ map: texArrowRight });

        function spawnEntity() {
            const lane = Math.floor(Math.random() * 3) - 1;
            const rand = Math.random();

            if (rand < 0.2) { // Placa de curva
                const isLeft = Math.random() > 0.5;
                const sign = new THREE.Mesh(signGeo, isLeft ? signLeftMat : signRightMat);
                sign.position.set(isLeft ? -7.9 : 7.9, 3, -80); sign.rotation.y = isLeft ? Math.PI / 2 : -Math.PI / 2;
                sign.type = 'sign'; worldGroup.add(sign); entities.push(sign);
            } else if (rand < 0.5) { // Moedas
                for (let i = 0; i < 3; i++) {
                    const coin = new THREE.Mesh(coinGeo, coinMat);
                    coin.position.set(lane * laneWidth, 1, -80 - (i * 2));
                    coin.type = 'coin'; coin.hitHeight = 1; worldGroup.add(coin); entities.push(coin);
                }
            } else { // Obstáculos Fatais
                if (Math.random() > 0.4) { // Trem (Pular)
                    const train = new THREE.Mesh(trainGeo, trainMat);
                    train.position.set(lane * laneWidth, 1.25, -80);
                    train.type = 'train'; train.hitHeight = 2.5; worldGroup.add(train); entities.push(train);
                } else { // Barreira Flutuante (Agachar)
                    const barrier = new THREE.Mesh(barrierGeo, barrierMat);
                    barrier.position.set(lane * laneWidth, 2.2, -80);
                    barrier.type = 'barrier'; barrier.hitHeight = 0.5; worldGroup.add(barrier); entities.push(barrier);
                }
            }
        }

        // --- 5. CONTROLES ---
        window.addEventListener('keydown', (e) => {
            if (!gameActive) return;
            if (e.key === 'ArrowLeft' && currentLane > -1) currentLane--;
            else if (e.key === 'ArrowRight' && currentLane < 1) currentLane++;
            else if (e.key === 'ArrowUp' && !isJumping && !isCrouching) {
                isJumping = true; yVelocity = 0.35; playSound('jump');
            }
            else if (e.key === 'ArrowDown' && !isJumping && !isCrouching) {
                isCrouching = true; crouchTimer = 40; playSound('crouch');
                // Achata os personagens
                player.scale.y = 0.5; player2.scale.y = 0.5;
            }
        });

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
        });

        // --- 6. LÓGICA GERAL ---
        function resetGame() {
            score = 0; coinsCollected = 0; speed = 0.4; currentLane = 0; scoreEl.innerText = score; coinsEl.innerText = coinsCollected;
            player.position.set(0, 1, 0); player2.position.set(1.2, 0.9, 1.5);
            player.scale.y = 1; player2.scale.y = 1;
            isJumping = false; isCrouching = false; yVelocity = 0; curveTime = 0; curveOffset = 0;
            entities.forEach(ent => worldGroup.remove(ent)); entities = [];
            gameActive = true; menuEl.style.display = 'none';
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function gameOver() {
            gameActive = false; playSound('crash');
            menuEl.style.display = 'flex'; menuEl.querySelector('h1').innerText = "BATIDA!";
            menuEl.querySelector('p').innerHTML = `Sua dupla não sobreviveu.<br><br>Pontos: ${score} | Moedas: ${coinsCollected}`;
        }
        document.getElementById('start-btn').addEventListener('click', resetGame);

        // --- 7. LOOP DE ANIMAÇÃO ---
        function animate() {
            requestAnimationFrame(animate);
            if (!gameActive) { renderer.render(scene, camera); return; }

            // Anima textura dos trilhos para dar sensação de velocidade
            trackTexture.offset.y -= speed * 0.006;

            // Curva do mundo (Zigue-zague)
            curveTime += 0.005; curveOffset = Math.sin(curveTime) * 4;
            worldGroup.position.x = -curveOffset; 

            // Movimento lateral do Player 1
            const targetX = (currentLane * laneWidth) - curveOffset;
            player.position.x += (targetX - player.position.x) * 0.2;

            // Player 2 segue o Player 1 (com offset para a direita e para trás)
            player2.position.x += ((targetX + 1.2) - player2.position.x) * 0.15;
            player2.position.z = player.position.z + 1.5;

            // Física de Pulo
            if (isJumping) {
                player.position.y += yVelocity; player2.position.y += yVelocity;
                yVelocity -= 0.02; // Gravidade
                if (player.position.y <= 1) { 
                    player.position.y = 1; player2.position.y = 0.9; isJumping = false; 
                }
            } 
            // Física de Agachamento
            else if (isCrouching) {
                crouchTimer--;
                player.position.y = 0.5; player2.position.y = 0.45; // Ficam rentes ao chão
                if (crouchTimer <= 0) {
                    isCrouching = false; player.scale.y = 1; player2.scale.y = 1;
                    player.position.y = 1; player2.position.y = 0.9;
                }
            }

            // Gerador de Obstáculos
            spawnTimer++;
            if (spawnTimer > (70 - Math.min(speed * 50, 40))) { spawnEntity(); spawnTimer = 0; }

            // Lógica de Entidades e Colisão
            for (let i = entities.length - 1; i >= 0; i--) {
                let ent = entities[i];
                ent.position.z += speed;
                if (ent.type === 'coin') ent.rotation.y += 0.1;

                // Verificação de Colisão para os dois personagens (AABB Básico)
                const entGlobalX = ent.position.x + worldGroup.position.x;
                
                function checkCollision(p, isP2) {
                    if(ent.type === 'sign') return false;
                    
                    const hitX = Math.abs(p.position.x - entGlobalX) < (isP2 ? 1.0 : 1.2);
                    const hitZ = Math.abs(p.position.z - ent.position.z) < 1.5;
                    
                    // Altura dinâmica baseada no agachamento
                    const pHeight = isCrouching ? (isP2 ? 0.9 : 1) : (isP2 ? 1.8 : 2);
                    const hitY = Math.abs(p.position.y - ent.position.y) < (pHeight/2 + ent.hitHeight/2);
                    
                    return hitX && hitY && hitZ;
                }

                const hitPlayer1 = checkCollision(player, false);
                const hitPlayer2 = checkCollision(player2, true);

                if (hitPlayer1 || hitPlayer2) {
                    if (ent.type === 'train' || ent.type === 'barrier') {
                        gameOver();
                    } else if (ent.type === 'coin') {
                        playSound('coin'); coinsCollected++; coinsEl.innerText = coinsCollected; score += 5;
                        worldGroup.remove(ent); entities.splice(i, 1); continue;
                    }
                }

                // Limpeza e Pontuação
                if (ent.position.z > 8) {
                    if (ent.type === 'train' || ent.type === 'barrier') {
                        score += 10; scoreEl.innerText = score;
                        if (score % 100 === 0) speed += 0.01;
                    }
                    worldGroup.remove(ent); entities.splice(i, 1);
                }
            }

            if (Math.random() < 0.1) { score++; scoreEl.innerText = score; }
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
